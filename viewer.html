<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rocklabs.rocks — 3D viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #canvas-wrap { position: absolute; inset: 0; }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 0.75rem 1rem;
    z-index: 10;
    pointer-events: none;
  }
  header a, header span { pointer-events: auto; }
  header a {
    color: #0055cc;
    text-decoration: none;
    font-size: 0.95rem;
  }
  header a:hover { text-decoration: underline; }
  #status {
    color: #666;
    font-size: 0.9rem;
  }
  #downloads { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  body.embedded header { display: none; }
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 85, 204, 0.08);
    border: 3px dashed #0055cc;
    display: none;
    align-items: center;
    justify-content: center;
    color: #0055cc;
    font-size: 1.3rem;
    z-index: 20;
    pointer-events: none;
  }
  body.dragging #drop-overlay { display: flex; }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <header>
    <a href="index.html">&larr; rocklabs.rocks</a>
    <span id="status"></span>
    <span id="downloads"></span>
  </header>
  <div id="drop-overlay">drop your STL file</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/three.module.js",
      "three/addons/controls/OrbitControls.js": "./assets/vendor/three/OrbitControls.js",
      "three/addons/loaders/STLLoader.js": "./assets/vendor/three/STLLoader.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const wrap = document.getElementById('canvas-wrap');
    const status = document.getElementById('status');
    const downloads = document.getElementById('downloads');
    const params = new URLSearchParams(location.search);
    const embedded = params.has('embed');
    if (embedded) document.body.classList.add('embedded');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
    camera.up.set(0, 0, 1);
    camera.position.set(0, 0, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(1, 1, 1);
    scene.add(dir);

    const DEFAULT_COLOR = 0x8a8a8a;
    const group = new THREE.Group();
    scene.add(group);
    const loader = new STLLoader();
    let loadGeneration = 0;

    function tellParent(type, data = {}) {
      if (embedded) parent.postMessage({ source: 'rocklabs-viewer', type, ...data }, location.origin);
    }

    function clearGroup() {
      for (const child of [...group.children]) {
        group.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      group.position.set(0, 0, 0);
    }

    function addGeometry(geometry, color) {
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.65, metalness: 0.1 });
      group.add(new THREE.Mesh(geometry, material));
    }

    // recenter the whole group and fit the camera once every part is in
    function fitView(name) {
      const box = new THREE.Box3().setFromObject(group);
      const center = box.getCenter(new THREE.Vector3());
      group.position.sub(center);
      const half = box.getSize(new THREE.Vector3()).multiplyScalar(0.5);
      const direction = new THREE.Vector3(-0.40, -0.65, 0.75).normalize();
      if (params.get('view') === 'top') {
        direction.set(0, 0, 1);
        camera.up.set(0, 1, 0);
      }
      camera.position.copy(direction);
      camera.lookAt(0, 0, 0);
      camera.updateMatrixWorld();
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
      const tanV = Math.tan(camera.fov * Math.PI / 360);
      let dist = 1;
      for (const x of [-half.x, half.x]) for (const y of [-half.y, half.y]) for (const z of [-half.z, half.z]) {
        const corner = new THREE.Vector3(x, y, z);
        const depth = corner.dot(direction);
        dist = Math.max(dist, depth + Math.abs(corner.dot(right)) / (tanV * camera.aspect), depth + Math.abs(corner.dot(up)) / tanV);
      }
      dist *= 1.15;
      camera.position.copy(direction).multiplyScalar(dist);
      camera.near = dist / 100;
      camera.far = dist * 100;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();
      status.textContent = name;
      status.dataset.loaded = 'true';
      document.title = name + ' — rocklabs.rocks';
      tellParent('loaded', { name });
    }

    // each ?model= entry is "url" or "url|hexcolor", e.g. model=models/a.stl|cc4433
    async function loadURLs(specs) {
      const generation = ++loadGeneration;
      status.textContent = 'loading…';
      status.dataset.loaded = 'false';
      clearGroup();
      downloads.innerHTML = '';
      const entries = specs.map(spec => {
        const [url, hex] = spec.split('|');
        return { url, color: /^[0-9a-f]{6}$/i.test(hex || '') ? parseInt(hex, 16) : DEFAULT_COLOR };
      });
      const results = await Promise.allSettled(entries.map(({ url }) => loader.loadAsync(url)));
      if (generation !== loadGeneration) {
        results.forEach(result => { if (result.status === 'fulfilled') result.value.dispose(); });
        return;
      }
      const failures = [];
      results.forEach((result, i) => {
        const { url, color } = entries[i];
        if (result.status === 'rejected') { failures.push(url); return; }
        addGeometry(result.value, color);
        const dl = document.createElement('a');
        dl.href = url;
        dl.download = url.split('/').pop().split('?')[0];
        dl.textContent = '⬇ download ' + dl.download;
        downloads.appendChild(dl);
      });
      if (group.children.length) fitView(params.get('label') || entries.map(({ url }) => url.split('/').pop().split('?')[0]).join(' + '));
      if (failures.length) {
        status.textContent = 'could not load ' + failures.join(', ');
        status.dataset.loaded = 'error';
        tellParent('error', { message: status.textContent });
      }
    }

    if (params.getAll('model').length) loadURLs(params.getAll('model'));
    else status.textContent = 'no model loaded — drop an .stl file here';

    // drag & drop local STL files
    let dragDepth = 0;
    addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
    addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        ++loadGeneration;
        clearGroup();
        downloads.innerHTML = '';
        try {
          addGeometry(loader.parse(reader.result), DEFAULT_COLOR);
          fitView(file.name);
        } catch {
          status.textContent = 'could not read this STL file';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
